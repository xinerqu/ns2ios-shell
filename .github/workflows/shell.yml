name: Build shell

# Builds the game-free shell and the Windows-side tools, then publishes them as a release.
#
# Two sources are supported:
#   fork      this repository's tree (default for manual runs and pushes)
#   upstream  the latest seedds/nxnative commit with this fork's changes copied over it, per .shell-overlay.txt
#             (the daily schedule uses this, so an upstream update becomes a new release without anyone acting)
#
# The output contains no game content: a few MB of app plus five Windows executables (the packer's tools, zstd among
# them, so a user never has to hunt for one). Users pack their own game files into the shell with scripts/nxn_pack.py
# and sideload the result.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Tree to build from (upstream = latest nxnative + this fork''s files, fork = this snapshot)'
        type: choice
        options: [upstream, fork]
        default: upstream
      publish:
        description: 'Publish a release (leave off to only build the artifacts)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'dm/**'
      - 'scripts/**'
      - '.shell-overlay.txt'
      # A commit that only moves the patch base or rewrites a patch is exactly the one that needs
      # `Assemble the source tree` to run; without these two lines it got no build at all.
      - '.shell-base.txt'
      - '.shell-patches/**'
      - '.github/workflows/shell.yml'
  schedule:
    - cron: '0 0 * * *'   # daily at 08:00 Beijing time, and only when upstream actually moved (see the check job)

permissions:
  contents: write           # creating releases

concurrency:
  group: shell-build
  cancel-in-progress: false

jobs:
  check:
    # The nightly run exists to pick up upstream's new games, not to rebuild what is already published: if the latest
    # release was built from upstream's current commit, do nothing. Pushes and manual runs always build, because what
    # changed is our own tree.
    name: Anything new upstream
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      upstream: ${{ steps.decide.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0          # git diff against the previous release's commit

      - name: Compare upstream with the latest release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          UP=''; LATEST=''; NEEDED=true; WHY=''
          if [ "$EVENT" != schedule ]; then
            WHY="triggered by $EVENT, which means our own tree changed"
          else
            # A failure to ask must not cost the nightly build: build anyway and let the rest of the pipeline report.
            UP=$(gh api repos/seedds/nxnative/commits/main --jq .sha) || WHY='upstream could not be reached'
            if [ -n "$UP" ]; then
              echo "upstream=$UP" >> "$GITHUB_OUTPUT"
              LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""') \
                || WHY='the release list could not be read'
              # What the newest release was built from is in its first line ("Source: upstream <sha>"), not in its tag:
              # a tag is shell-<date>-<upstream7>-<fork7>, so its last segment is THIS repository's sha and comparing
              # that against upstream's can never match -- which quietly turned every nightly run into a rebuild and a
              # republish, and buried the current release among a day's worth of them.
              PREV_UP=''
              if [ -n "$LATEST" ]; then
                PREV_UP=$(gh release view "$LATEST" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null \
                          | sed -n 's/^Source: upstream \([0-9a-f]\{7,\}\).*/\1/p' | head -1) || true
              fi
              # A release is a snapshot of this repository, not just a shell: GitHub attaches the source (Source code zip
              # and tar.gz) to every release, and the packer a user runs is that source. So publishing on every change is
              # the honest behaviour -- one place to download from, and what is on the releases page is what was built.
              # Skip only when BOTH upstream and this tree are already published: nothing would differ.
              HEAD_SHA=$(git rev-parse HEAD)
              PREV_SHA=$(echo "$LATEST" | awk -F- '{print $NF}')   # the tag's last segment is this repository's commit
              if [ -z "$WHY" ] && [ -n "$PREV_UP" ] && [ "$PREV_UP" = "$UP" ] && [ "$PREV_SHA" = "$HEAD_SHA" ]; then
                NEEDED=false; WHY="upstream $UP and this tree are both already published as $LATEST"
              fi
              [ -n "$WHY" ] || WHY="upstream ${UP:0:7} or this tree ${HEAD_SHA:0:7} is not what ${LATEST:-nothing} was built from"
            fi
          fi
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          echo "build=$NEEDED ($WHY)"
          {
            echo "### Nightly check"
            echo
            echo "- upstream: \`${UP:-unknown}\`"
            echo "- latest release: \`${LATEST:-none}\`"
            echo "- build: **$NEEDED** — $WHY"
          } >> "$GITHUB_STEP_SUMMARY"

  tools:
    name: Windows tools
    needs: [check]
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build nx_extract
        run: dotnet publish dm/tools/nx_extract -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/nx_extract

      - name: Build the shader translator
        run: dotnet publish dm/gfx/tools/dmsh_xlate -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/dmsh_xlate

      - name: Build SPIRV-Cross at the pinned tag
        run: |
          git clone --branch vulkan-sdk-1.4.357.0 --depth 1 https://github.com/KhronosGroup/SPIRV-Cross
          # no -G: the runner's Visual Studio version changes over time and naming it by version is what broke this before
          cmake -S SPIRV-Cross -B SPIRV-Cross/build -DSPIRV_CROSS_ENABLE_TESTS=OFF
          cmake --build SPIRV-Cross/build --config Release --target spirv-cross

      - name: Build glslang at the pinned tag
        run: |
          git clone --branch 16.0.0 --depth 1 https://github.com/KhronosGroup/glslang
          # GLSL → SPIR-V for the packer's --gl-capture route (an OpenGL game's captured shaders). Apple's Metal compiler
          # only exists on a Mac, but this half of the chain runs anywhere.
          cmake -S glslang -B glslang/build -DGLSLANG_TESTS=OFF -DENABLE_OPT=OFF -DENABLE_HLSL=OFF -DGLSLANG_ENABLE_INSTALL=OFF
          cmake --build glslang/build --config Release --target glslang-standalone

      - name: Fetch zstd
        shell: bash
        run: |
          set -euo pipefail
          # shader_split.py needs a zstd decoder for every game whose files are zstd-compressed (Rhythm Heaven Groove's .zs,
          # Paper Mario's .zst, Tears of the Kingdom's dictionary frames). macOS and Linux have the `zstd` command; Windows
          # does not, and telling a user to go and find one is not what a tools bundle is for. It ships here, fifth.
          curl -sSfL -o zstd.zip https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip
          mkdir -p out/zstd
          unzip -q -j zstd.zip 'zstd-v1.5.7-win64/zstd.exe' -d out/zstd
          ./out/zstd/zstd.exe --version

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/spirv-cross out/glslang
          exe=$(find SPIRV-Cross -name 'spirv-cross.exe' -type f | head -1)
          test -n "$exe" || { echo "::error::spirv-cross.exe was not produced"; exit 1; }
          cp "$exe" out/spirv-cross/
          # glslang's CLI target is glslang-standalone and it comes out as glslang.exe; gl_shaders.py calls it
          # glslangValidator, the name the source builds and every release archive use.
          gl=$(find glslang/build \( -name 'glslang.exe' -o -name 'glslangValidator.exe' \) -type f | head -1)
          test -n "$gl" || { echo "::error::glslang.exe was not produced"; exit 1; }
          cp "$gl" out/glslang/glslangValidator.exe
          test -f out/nx_extract/nx_extract.exe
          test -f out/dmsh_xlate/dmsh_xlate.exe
          test -f out/zstd/zstd.exe
          ./out/spirv-cross/spirv-cross.exe --help > /dev/null
          ./out/glslang/glslangValidator.exe --version

          # Stage the executables in one flat folder. Uploading separate paths makes the artifact keep
          # nx_extract/nx_extract.exe, and every consumer of the artifact then has to know that layout; one folder
          # uploads flat, so tools/ ends up with exactly the .exe files nxn_pack.py --tools expects.
          mkdir -p stage
          cp out/nx_extract/nx_extract.exe out/dmsh_xlate/dmsh_xlate.exe out/spirv-cross/spirv-cross.exe \
             out/glslang/glslangValidator.exe out/zstd/zstd.exe stage/
          ls -l stage

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: stage
          if-no-files-found: error

  shell:
    name: Shell
    needs: [check]
    if: needs.check.outputs.needed == 'true'
    permissions:
      contents: write        # the nightly sync commits the packer's copies
    # xcode-27, not macos-26: upstream's iOS code now uses an iOS 27 API (CMMotionManager.deviceMotionBody, cca3333), and
    # @available(iOS 27, *) guards the call, not the symbol -- with the macos-26 image's iOS 26.5 SDK the build stops at
    # "property 'deviceMotionBody' not found on object of type 'CMMotionManager *'" and nothing can be published.
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tree.outputs.version }}
      tag: ${{ steps.tree.outputs.tag }}
      origin: ${{ steps.tree.outputs.origin }}
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Assemble the source tree
        id: tree
        env:
          REQUESTED: ${{ inputs.source || 'upstream' }}   # upstream by default: this repository only carries the diff
        run: |
          # keep this step's output too: a failure here happens before the build log exists
          exec > >(tee "$RUNNER_TEMP/shell.out") 2>&1
          set -euxo pipefail
          source="$REQUESTED"
          src=fork
          if [ "$source" = upstream ]; then
            echo "::group::fetch upstream"
            git clone --depth 1 https://github.com/seedds/nxnative.git up
            UP=$(git -C up rev-parse HEAD)
            echo "upstream commit $UP"
            # Apply this fork onto the upstream tree. Files this fork adds are copied; files it modifies are patched, so an
            # upstream edit elsewhere in the same file survives instead of being overwritten by a whole-file copy.
            while IFS= read -r line; do
              p="${line#+}"; p="${p%%#*}"
              p="$(echo "$p" | tr -d '[:space:]')"
              [ -n "$p" ] || continue
              mkdir -p "up/$(dirname "$p")"
              if [ -d "fork/$p" ]; then cp -a "fork/$p" "up/$(dirname "$p")/"; else cp -a "fork/$p" "up/$p"; fi \
                || { echo "::error::cannot copy $p"; exit 1; }
            done < <(grep -E '^\+' fork/.shell-overlay.txt)

            # absolute: git -C up changes directory, so a relative patch path would resolve inside up/
            PATCHDIR="$(pwd)/fork/.shell-patches"
            n=0
            for f in "$PATCHDIR"/*.patch; do
              [ -e "$f" ] || continue
              if ! git -C up apply --whitespace=nowarn "$f"; then
                echo "::error::$(basename "$f") does not apply: upstream changed the same lines this fork patches."
                echo "Rebase those hunks onto the current upstream text (see docs/SHELL.md), regenerate the patch, push."
                exit 1
              fi
              n=$((n+1))
            done
            echo "applied $n patches"
            src=up
            SHA=$UP   # GITHUB_ENV only reaches later steps; this step needs the value itself for the version string
            echo "::endgroup::"
            echo "origin=upstream $UP" >> "$GITHUB_OUTPUT"
            echo "SHA=$UP" >> "$GITHUB_ENV"
          else
            SHA=$(git -C fork rev-parse HEAD)
            echo "origin=fork $SHA" >> "$GITHUB_OUTPUT"
            echo "SHA=$SHA" >> "$GITHUB_ENV"
          fi
          # Two names, for two different jobs.
          #
          # V is the asset file stem: it names both halves of the build -- the upstream commit the tree came from and this
          # fork's commit, whose patches and overlay files are half the shell. Naming only upstream meant a fixed shell was
          # published under the same name as the broken one: the assets were overwritten in place and nobody could tell the
          # two apart.
          #
          # TAG is the release tag, and it is a version number because GitHub orders the releases list by TAG NAME, not by
          # date (checked 2026-10-29: a release titled zzz-title under tag t-00000000-mmm sorted by its tag, not its title).
          # With a date-and-sha tag, two releases of the same day were ordered by the sha characters -- '3' sorts above '2'
          # -- so the newest release sat second in the list. Four digits, so that v0.0.0010 still sorts above v0.0.0009; an
          # unpadded v0.0.10 would sort below v0.0.9. A failed build makes no tag, so the number never skips, and the
          # shell-build concurrency group serialises runs, so two runs cannot take the same one.
          FORK=$(git -C fork rev-parse --short=7 HEAD)
          if [ "$SHA" = "$FORK" ]; then V="shell-$(date -u +%Y%m%d)-$FORK"
          else V="shell-$(date -u +%Y%m%d)-$(echo "$SHA" | cut -c1-7)-$FORK"; fi
          LAST=$(git -C fork ls-remote --tags --refs origin 'refs/tags/v0.0.*' | sed 's#.*refs/tags/v0\.0\.##' | sort -n | tail -1)
          # 10# : bash reads a zero-padded number as octal, so v0.0.0010 + 1 evaluated to 9 and the release took the tag
          # v0.0.0009 -- one that already existed, which the publish step then overwrote in place instead of failing
          # (2026-10-29). Parse base ten explicitly; v0.0.0008 + 1 would have thrown "value too great for base".
          TAG="v0.0.$(printf '%04d' $(( 10#${LAST:-0} + 1 )))"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TREE=$src" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "building $V from $src, release tag $TAG"

      - name: Keep the packer's copies level with upstream
        # The packer a user runs reads this repository's copies of dm/tools, dm/gfx/tools and dm/games. They are not
        # patched, so the overlay never mentions them and nothing kept them level with the tree the shell is built from --
        # which is how the shell stayed current while the rewriter stayed months old. The nightly copies them over and
        # commits. Files this fork patches or adds are left to a human, because those need reading.
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/fork"
          python3 dm/tools/packer_sync.py . "$TREE" --sync
          if [ -z "$(git status --porcelain)" ]; then echo "already level with upstream"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sync the packer's copies with upstream

          dm/tools, dm/gfx/tools and dm/games are what the packer in this repository runs. They are not patched, so the
          overlay never mentions them and nothing kept them level with the tree the shell is built from. Copied from the
          tree this run assembled; the files this fork patches or adds are left alone."
          git push

      - name: Report drift a human has to look at
        # Whatever still differs after the sync is a file this fork patches that upstream moved: that needs a rebase, not
        # a copy. Warning only, but never silent.
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/fork/dm/tools/packer_sync.py" "$GITHUB_WORKSPACE/fork" "$TREE" \
            > "$RUNNER_TEMP/drift.txt" || true
          cat "$RUNNER_TEMP/drift.txt"
          { echo "### Packer vs upstream"; echo; echo '```'; cat "$RUNNER_TEMP/drift.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q . "$RUNNER_TEMP/drift.txt"; then
            echo "::warning::$(head -1 "$RUNNER_TEMP/drift.txt") -- see the job summary."
          fi

      - name: Install dependencies
        run: |
          set -euo pipefail
          # xcodegen builds the project; fontTools is what make_ext_font.py draws the button-icon font with
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages fonttools \
            || python3 -m pip install --quiet fonttools
          python3 -c "import fontTools; print('fontTools', fontTools.version)"

      - name: Check the packer and the tools it drives
        run: |
          set -euo pipefail
          # cd, not working-directory: ${{ env.X }} does not see values written to GITHUB_ENV at run time
          cd "$TREE"
          # this repository is public: a packed game or a key file must never be reachable from what gets built here
          leak=$(find . -path ./.git -prune -o -type f \
                   \( -name '*.nsp' -o -name '*.xci' -o -name '*.nsz' -o -name '*.xcz' -o -name '*.nca' \
                      -o -name '*.tik' -o -name '*.keys' -o -name 'prod.keys' -o -name '*.ipa' \) -print || true)
          test -z "$leak" || { echo "::error::game files or keys are in the tree: $leak"; exit 1; }
          python3 -m py_compile scripts/nxn_pack.py dm/gfx/tools/nometal_run.py dm/ios/tools/pack_ipa.py dm/tools/guest_dylib.py dm/ios/tools/make_shell_patch.py
          python3 scripts/nxn_pack.py --help > /dev/null
          # nometal_run.py answers the four toolchain probes Apple's compiler would answer: if one regresses, every
          # packing attempt on a machine without Xcode dies at the shader step.
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('nm', 'dm/gfx/tools/nometal_run.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          for cmd, want in ((['xcrun','-sdk','macosx','metal','--version'], 'none'),
                            (['xcrun','-sdk','macosx','metallib','--version'], 'none'),
                            (['xcrun','-sdk','iphoneos','--show-sdk-version'], '26.0'),
                            (['xcrun','-sdk','iphoneos','--show-sdk-build-version'], '26A000')):
              got = m.run(cmd, capture_output=True, text=True).stdout.strip()
              assert got == want, (cmd, got, want)
          print('nometal_run: 4/4 probes answered')
          PY

      - name: Build the shell
        env:
          DM_ROOT: ${{ runner.temp }}/dm-work
        run: |
          set -euo pipefail
          cd "$TREE"
          echo "tree: $PWD"
          ls -l dm/ios/tools/shell_build.sh dm/games/0000000000000000/game.tsv
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          test "${SDK%%.*}" -ge 26 || { echo "::error::iOS 26 SDK required, runner has $SDK"; exit 1; }
          bash dm/ios/tools/shell_build.sh 2>&1 | tee "$RUNNER_TEMP/shell.out"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$DM_ROOT/build/shell/nxnative-shell-build-input.zip" "$GITHUB_WORKSPACE/dist/${V}.zip"   # V already begins with shell-
          cp "$DM_ROOT/build/shell/shell_files.tsv" "$GITHUB_WORKSPACE/dist/${V}-contents.tsv"

      - name: Generate the supported-games list
        run: |
          set -euo pipefail
          # Generated from the profiles this repository carries, which is what the packer in it is built for: a profile
          # that arrived upstream after this snapshot may need rewriter patches this fork's snapshot does not have
          # (upstream moved per-game patches into the profile's patches.py), so listing it would promise more than it can
          # deliver. Those games are best effort, and the page says so.
          python3 "$GITHUB_WORKSPACE/fork/dm/tools/supported_list.py" \
              --games "$GITHUB_WORKSPACE/fork/dm/games" --md "$RUNNER_TEMP/SUPPORTED.md" \
              --tsv "$GITHUB_WORKSPACE/dist/${V}-supported.tsv"
          # The page in the repository is generated from the same tree, so it can be compared against it: a page that
          # lags behind upstream is a page that tells someone their game is unsupported when it is not. Still only a
          # warning -- a page is not a release, and upstream adding a game should not fail a build.
          if ! python3 "$GITHUB_WORKSPACE/fork/dm/tools/supported_list.py" \
                 --games "$GITHUB_WORKSPACE/fork/dm/games" \
                 --md "$GITHUB_WORKSPACE/fork/docs/SUPPORTED.md" --check; then
            echo "::warning::docs/SUPPORTED.md is out of date with dm/games: regenerate it and commit the page. (The release asset above is already correct.)"
          fi

      - name: Summarise
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/dist/${V}-contents.tsv"
          {
            echo "### Shell ${V}"
            echo
            echo "- source: ${{ steps.tree.outputs.origin }}"
            if [ -f "$f" ]; then echo "- contents: $(wc -l < "$f" | tr -d ' ') files"; echo '```'; head -40 "$f"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shell
          path: dist/*
          if-no-files-found: error

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-build-log
          path: |
            ${{ runner.temp }}/dm-work/build/shell/build.log
            ${{ runner.temp }}/dm-work/build/shell/xcodegen.log
            ${{ runner.temp }}/dm-work/build/shell/xcodebuild-list.log
            ${{ runner.temp }}/shell.out
          if-no-files-found: ignore

  # Packs one small game with the shell that was just built, before anything is published. The game files and keys live in a
  # private repository as release assets and are fetched here with a token; that repository runs no workflows (Actions minutes
  # are the scarce resource, storage is not), and the public repository's runners are free.
  smoke:
    name: Smoke pack
    needs: [tools, shell]
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      # '1' when a real game was actually packed and inspected. Empty means the test data could not be fetched, which says
      # nothing about the shell -- the release is then published and labelled unverified rather than silently trusted.
      verified: ${{ steps.data.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shell
          path: built

      - uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: tools-in

      - name: Fetch the test data
        id: data
        env:
          TOKEN: ${{ secrets.SMOKE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Two different things can go wrong here, and they must not be confused:
          #   the test data cannot be reached (no token, expired token, asset gone) -> no verdict about the shell.
          #     Warn, leave the output empty, publish anyway and mark the release unverified.
          #   the pack or the checks that follow fail -> a real verdict about the shell. Fail, and nothing is published.
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::SMOKE_TOKEN is not set, so this build cannot be smoke-tested. It will be published marked unverified. Add a token with read access to xinerqu/ns2ios-smoke to verify builds again."
            echo "**Not smoke-tested** — no SMOKE_TOKEN, so this build is published marked unverified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p data tools
          # the artifact should be flat, but do not depend on it: take every .exe wherever it landed
          find tools-in -name '*.exe' -type f -exec cp {} tools/ \;
          ls -l tools
          for t in nx_extract dmsh_xlate spirv-cross; do
            test -f "tools/$t.exe" || { echo "::error::the windows-tools artifact has no $t.exe"; exit 1; }
          done
          api=https://api.github.com/repos/xinerqu/ns2ios-smoke/releases/tags/smoke-data
          if ! curl -sSfL -H "Authorization: Bearer $TOKEN" "$api" -o rel.json; then
            echo "::warning::cannot read the test data (SMOKE_TOKEN expired, or xinerqu/ns2ios-smoke/tags/smoke-data is gone). This build cannot be smoke-tested and will be published marked unverified."
            echo "**Not smoke-tested** — the test data could not be fetched, so this build is published marked unverified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for name in game.nsp prod.keys; do
            url=$(python -c "import json,sys;d=json.load(open('rel.json'));print(next(a['url'] for a in d['assets'] if a['name']=='$name'))")
            curl -sSfL -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" "$url" -o "data/$name"
            echo "  fetched $name: $(stat -c %s "data/$name" 2>/dev/null || wc -c < "data/$name") bytes"
          done
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Pack the test game
        if: steps.data.outputs.ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet lz4 capstone fonttools backports.zstd pillow pyyaml
          shellzip=$(ls built/*.zip | head -1); echo "shell: $shellzip"
          mkdir -p out
          python scripts/nxn_pack.py "$shellzip" data -k data/prod.keys --tools tools -o out/smoke.ipa
          ls -l out

      - name: Check the package it produced
        if: steps.data.outputs.ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, plistlib, stat, sys, zipfile
          ipa = glob.glob('out/*.ipa')[0]
          z = zipfile.ZipFile(ipa)
          names = z.namelist()
          def mode(n): return z.getinfo(n).external_attr >> 16
          # env.txt carries the game's own memory layout (the shell was built with the placeholder's), and getting it wrong
          # is not a build failure but a SetHeapSize abort on the phone. Demand a real value rather than the file existing.
          env = z.read('Payload/DmIOS.app/dm/env.txt').decode('utf-8', 'replace') if 'Payload/DmIOS.app/dm/env.txt' in names else ''
          libs = [n for n in names if '/msl/b-' in n and n.endswith('_b.metallib')]
          # The shell's own stamp is what lets the packer refuse a shell that cannot dispatch something it wrote. If the
          # build stops writing it, that protection is gone without anything else failing -- so check the stamp itself.
          info = z.read('Payload/DmIOS.app/dm/shell_info.txt').decode('utf-8', 'replace') if 'Payload/DmIOS.app/dm/shell_info.txt' in names else ''
          checks = {
              'main binary executable': mode('Payload/DmIOS.app/DmIOS') == (stat.S_IFREG | 0o755),
              'guest binary executable': mode('Payload/DmIOS.app/Frameworks/Guest.framework/Guest') == (stat.S_IFREG | 0o755),
              'shader libraries present': len(libs) > 0,
              'romfs present': any('/romfs/' in n for n in names),
              'env.txt carries the memory layout': 'DM_APP_POOL=' in env,
              'shell declares its gate kinds': 'GATES=' in info,
              # iOS gives an app without this entitlement about 3,375 MB, which the bigger games fill exactly. The shell is
              # signed ad hoc with it so that an install tool can carry it over; losing it would only show on the phone, as
              # a game killed for memory with no crash log.
              'memory entitlement': b'increased-memory-limit' in z.read('Payload/DmIOS.app/DmIOS'),
              # upstream's settings screen before the game needs this file; without it the launcher starts the game at once
              'settings screen data': 'Payload/DmIOS.app/dm/launcher.json' in names,
          }
          pl = plistlib.loads(z.read('Payload/DmIOS.app/Info.plist'))
          checks['named after the game'] = bool(pl.get('CFBundleDisplayName'))
          # iOS identifies an app by its bundle ID: keeping the shell's would make every game replace the last one.
          bid = pl.get('CFBundleIdentifier') or ''
          checks['own bundle ID'] = bid.startswith('org.nxnative.') and bid != 'org.nxnative.shell'
          for k, v in checks.items(): print(('  ok   ' if v else '  FAIL ') + k)
          print('  %s: %.1f MB, %d entries, %d shader libraries' % (os.path.basename(ipa), os.path.getsize(ipa) / 1048576, len(names), len(libs)))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### Smoke pack\n\n`%s` — %.1f MB, %d entries, %d shader libraries\n\n| check | |\n|---|---|\n'
                      % (os.path.basename(ipa), os.path.getsize(ipa) / 1048576, len(names), len(libs)))
              for k, v in checks.items(): f.write('| %s | %s |\n' % (k, 'ok' if v else '**FAIL**'))
          sys.exit(0 if all(checks.values()) else 1)
          PY

  release:
    needs: [tools, shell, smoke]
    # A failed smoke pack blocks publishing, because "the packer died" every time so far has meant the shell and the packer
    # disagree. A smoke job that could not run (no token, data unreachable) is not a failure: the release goes out and the
    # notes say it was not verified, so the shell is never silently trusted and never silently withheld.
    #
    # A push does NOT publish: most pushes are mid-debugging, and a release per push buried the real one (23 of them in a
    # day, the newest somewhere in the middle) and put half-finished builds in front of users. A push still builds the shell
    # and the tools and runs the smoke pack -- the artifacts are there to download and test with. Publishing is either the
    # daily schedule (only when upstream actually moved) or a manual run with 'publish' ticked.
    if: |
      always() && needs.tools.result == 'success' && needs.shell.result == 'success'
      && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
      && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      # First, before anything downloads or writes files: when the workspace is not a git repository yet, checkout empties
      # the whole directory before cloning. It used to sit further down -- between "Pack the tools" and "Write the notes" --
      # which deleted the artifacts that had already been downloaded into it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags, so "what changed since the last release" can be answered

      - uses: actions/download-artifact@v4
        with:
          name: shell
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: tools

      - name: Pack the tools
        run: |
          set -euo pipefail
          # flatten: the archive must unpack into the .exe files, which is what --tools expects
          mkdir -p flat
          find tools -name '*.exe' -type f -exec cp {} flat/ \;
          ls -l flat
          for t in nx_extract dmsh_xlate spirv-cross glslangValidator zstd; do
            test -f "flat/$t.exe" || { echo "::error::the windows-tools artifact has no $t.exe"; exit 1; }
          done
          (cd flat && zip -q ../dist/nxnative-windows-tools.zip ./*.exe)

      - name: Write the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # What changed since the last release, from the commit subjects between that tag and this build. Written by hand
          # it goes stale, and a scheduled build has nobody to write it at all -- which is when a reader most needs to know
          # that the only thing that happened is "upstream moved".
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          SUBJ=""
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null 2>&1; then
            SUBJ=$(git log --no-merges --pretty='%s' "$PREV"..HEAD 2>/dev/null | head -30 || true)
          fi
          if [ -z "$SUBJ" ]; then
            CHANGES="- (no commits since ${PREV:-the previous release})"
            CHANGES_ZH="- （上一版之后没有新提交）"
          else
            CHANGES=$(printf '%s\n' "$SUBJ" | sed 's/^/- /')
            # The commit subjects are English, because the history is. Printing them under a Chinese heading is what this
            # used to do, and it read as untranslated boilerplate: the section said 本版变更 and then listed English. Each
            # subject is looked up in .github/release-notes.zh.tsv instead, one line per commit, and a subject that has no
            # row says so in the page rather than passing the English off as the translation.
            CHANGES_ZH=$(printf '%s\n' "$SUBJ" | while IFS= read -r s; do
              # sub() drops a UTF-8 BOM from the first key: a table saved by a Windows editor starts with one, and the first
              # row would then never match -- which reads as "that commit has no translation" rather than as a table bug.
              t=$(awk -F'\t' -v k="$s" 'BEGIN { sub(/^\xef\xbb\xbf/, "", k) } $1==k { print $2; exit }' .github/release-notes.zh.tsv 2>/dev/null || true)
              if [ -n "$t" ]; then printf -- '- %s\n' "$t"
              else printf -- '- %s\n  **未翻译**：这一条还没有中文，补一行到 `.github/release-notes.zh.tsv`\n' "$s"; fi
            done)
          fi
          AUTO_EN=""; AUTO_ZH=""
          if [ "$EVENT" = "schedule" ]; then
            AUTO_EN="Published automatically: the daily schedule found a new upstream commit and rebuilt from it."
            AUTO_ZH="本版为自动发布：定时任务发现上游有新提交后自动重建。"
          fi
          # English first, then a separator, then Chinese -- interleaving them segment by segment makes both hard to read.
          {
            echo '## What changed since the last release'; echo
            echo "$CHANGES"; echo
            if [ -n "$AUTO_EN" ]; then echo "$AUTO_EN"; echo; fi
          } > en.md
          {
            echo '## 本版变更（对比上一版）'; echo
            echo "$CHANGES_ZH"; echo
            if [ -n "$AUTO_ZH" ]; then echo "$AUTO_ZH"; echo; fi
          } > zh.md

          cat >> en.md <<'EOF'
          The game-free shell, plus the executables a packing machine needs. **Nothing here contains game content.**

          ## Files

          | File | What it is |
          |---|---|
          | `<version>.zip` | The shell: an unsigned iOS app with no game content. Pack your own game files into it. |
          | `nxnative-windows-tools.zip` | `nx_extract.exe`, `dmsh_xlate.exe`, `spirv-cross.exe`, `glslangValidator.exe`, `zstd.exe` — self-contained; no .NET SDK or C++ toolchain needed, and nothing else to install. |

          ## Use it

          1. Take the **whole repository** (`git clone` or the source zip) — the packer needs `dm/` beside `scripts/`, so the script alone cannot work. Unpack the tools too, e.g. to `D:/nxn-tools`.
          2. Put one game's files in a folder. **File names do not matter** — the game is identified from inside the package, so any naming scheme works. NSP and XCI both work, and an update or DLC can sit in the same folder; the newest version present is the one packed.
          3. `cd` into the repository, then `python scripts/nxn_pack.py <version>.zip <game folder> -k <prod.keys> --tools D:/nxn-tools`
          4. Sideload the IPA it writes (SideStore, Sideloadly, LiveContainer) and launch it once to compile the shaders.

          Temporary files (the extraction, the rewritten modules, the split shaders, the assembled app tree) are removed once the IPA exists — together they are several times the size of the game. Only a few-KB log per step stays, in `<title ID>_pack/logs/`. `--keep-work` keeps the whole tree for a faster repack; `--clean <game folder>` clears out an earlier run.

          The packing machine needs Python 3.9+ with `lz4 capstone fonttools backports.zstd pillow`.

          **Super Mario Galaxy 1 and 2 are the only games that need one capture before they play**; everything else packs into something playable in one run. See [docs/CAPTURE.md](https://github.com/xinerqu/ns2ios-shell/blob/main/docs/CAPTURE.md).

          Full instructions and the game list: [README.md](https://github.com/xinerqu/ns2ios-shell/blob/main/README.md)

          ## Credits

          Built on [nxnative](https://github.com/seedds/nxnative) by **seedds** (MIT) — the rewriter, the translation chain, the host and the game profiles are its work. The native-execution approach and the shell route come from [d2r-mobile](https://github.com/jhaizhou-ops/d2r-mobile) by **jhaizhou-ops** (MIT), which nxnative's generic parts started from; both projects borrow from each other. Two separate projects by two different authors.
          EOF

          cat >> zh.md <<'EOF'
          不含任何游戏内容的「壳」，以及打包机器需要的可执行文件。**这里没有任何游戏内容。**

          ## 文件

          | 文件 | 说明 |
          |---|---|
          | `<version>.zip` | 壳：不含游戏内容的未签名 iOS 应用，把自己的游戏文件打进去。 |
          | `nxnative-windows-tools.zip` | `nx_extract.exe`、`dmsh_xlate.exe`、`spirv-cross.exe`、`glslangValidator.exe`、`zstd.exe`——自包含，不需要 .NET SDK 或 C++ 工具链，也不用另装任何东西。 |

          ## 用法

          1. 下载**完整仓库**（`git clone` 或源码压缩包）——打包器需要 `scripts/` 旁边的 `dm/`，只拷那个脚本跑不了。工具也解压出来，比如放到 `D:/nxn-tools`。
          2. 把一个游戏的文件放进一个目录。**文件名不重要**——游戏是从包内容里认出来的，随便怎么命名都行。NSP 和 XCI 都支持，更新包和 DLC 可以放进同一个目录；会打包目录里最新的那个版本。
          3. 进仓库目录，执行 `python scripts/nxn_pack.py <version>.zip <游戏文件夹> -k <prod.keys> --tools D:/nxn-tools`
          4. 用自签工具（SideStore、Sideloadly、LiveContainer）装上它产出的 IPA，首次启动会编译一遍着色器。

          IPA 写好后临时文件会自动删除（解包、改写后的模块、拆出的着色器、拼装好的 app 树，加起来是游戏体积的好几倍），只留每步几 KB 的日志在 `<title ID>_pack/logs/`。`--keep-work` 保留整棵树以便快速重打包；`--clean <游戏文件夹>` 单独清掉之前留下的。

          打包机器需要 Python 3.9+ 以及 `lz4 capstone fonttools backports.zstd pillow`。

          **只有超级马里奥银河 1、2 需要在玩之前抓取一次**，其余游戏打一次就是成品。详见 [docs/CAPTURE.zh-CN.md](https://github.com/xinerqu/ns2ios-shell/blob/main/docs/CAPTURE.zh-CN.md)。

          完整说明与支持列表：[README.zh-CN.md](https://github.com/xinerqu/ns2ios-shell/blob/main/README.zh-CN.md)

          ## 致谢

          基于 **seedds** 的 [nxnative](https://github.com/seedds/nxnative)（MIT）——改写器、翻译链、宿主与游戏 profile 都是它的成果。原生执行方案与「壳」路线来自 **jhaizhou-ops** 的 [d2r-mobile](https://github.com/jhaizhou-ops/d2r-mobile)（MIT），nxnative 的通用部分即从其起步；两个项目互相借鉴。它们是两个独立项目、两位不同作者。
          EOF

          { cat en.md; echo; echo '---'; echo; cat zh.md; } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.shell.outputs.tag }}"                  # v0.0.0001, v0.0.0002, ... the list sorts by this
          VER="${{ needs.shell.outputs.version }}"              # shell-<date>-<upstream>-<fork>, the asset file stem
          TITLE="Game-free shell ${VER#shell-}"                 # the page's heading keeps the date and both commits
          # Say on the page whether this shell was actually packed with a real game before it went out. The smoke job sets
          # verified=1 only when it managed to pack and inspect one; when the test data is unreachable the build is still
          # published, but nobody should have to guess whether it was tested.
          {
            echo "Source: ${{ needs.shell.outputs.origin }}"
            if [ "${{ needs.smoke.outputs.verified }}" = '1' ]; then
              echo "Smoke test: **passed** — a real game was packed with this shell on Windows before publishing. <br> 冒烟测试：**通过**——发布前已用真实游戏在 Windows 上完整打过一次包。"
            else
              echo "> **Not smoke-tested** — the test data could not be fetched, so nothing was packed with this shell before publishing. <br> **未做冒烟测试**：取不到测试数据，这一版发布前没有用它打过包。"
            fi
            echo
            cat notes.md
          } > body.md
          # A rerun of this job computes the same tag again and replaces its own assets, so a rerun is not a failure.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A rerun of this job computes the same tag again and replaces its own assets. Anything else means the number
            # was reused, and quietly overwriting a published release is exactly how v0.0.0009 lost its own title and
            # assets to the octal bug above: refuse unless this release is already this build.
            EXIST=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name -q .name)
            if [ "$EXIST" != "$TITLE" ]; then
              echo "::error::$TAG already names another release ($EXIST): the version number was reused, not overwritten"
              exit 1
            fi
            gh release upload "$TAG" dist/*.zip dist/*.tsv --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file body.md
          else
            gh release create "$TAG" dist/*.zip dist/*.tsv --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file body.md
          fi
          echo "published $TAG" >> "$GITHUB_STEP_SUMMARY"

